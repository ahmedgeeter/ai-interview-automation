version: "3.8"

services:
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/app
    env_file:
      - ./backend/.env
    environment:
      - AEGRA_URL=http://aegra:2026
    depends_on:
      - aegra
    restart: always

  aegra:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["aegra", "serve", "--host", "0.0.0.0", "--port", "2026"]
    ports:
      - "2026:2026"
    volumes:
      - ./backend:/code
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_URL=postgresql://aegra:aegra@postgres:5432/aegra
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=aegra
      - POSTGRES_PASSWORD=aegra
      - POSTGRES_DB=aegra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegra -d aegra"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:

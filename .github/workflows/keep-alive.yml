name: Keep Backend Alive

on:
  schedule:
    - cron: '*/14 * * * *' # Runs every 14 minutes
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging backend to prevent free tier sleep..."
          curl -sSf "https://ai-interview-automation.onrender.com/api/health" > /dev/null || echo "Ping failed or backend took too long."
